<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Her Process</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#f7f4ef" />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #f7f4ef; }
      body {
        overscroll-behavior-y: none; color: #382c30;
        font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
      }
      *, *::before, *::after { box-sizing: border-box; }
      button, input, select, textarea { font-family: inherit; }
      /* Sur téléphone, un champ en dessous de 16 px fait zoomer l'iPhone à chaque saisie */
      @media (pointer: coarse) { input, select, textarea { font-size: 16px !important; } }
      ::placeholder { color: #a59597; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
